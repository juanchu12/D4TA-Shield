services:
  shield-engine:
    build: .
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      DATA_DIR: /data
    volumes:
      - engine_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  engine_data:
